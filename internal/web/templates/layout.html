{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
{{end}}

{{define "brand"}}
<header class="top">
  <div class="inner">
    <a class="brand" href="/">
      <img src="/static/favicon.svg" alt="" width="24" height="24">
      <span>{{.Owner}}</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="/" {{if eq .Section "projects"}}aria-current="page"{{end}}>Projects</a>
      <a href="/status" {{if eq .Section "status"}}aria-current="page"{{end}}>Status</a>
    </nav>
  </div>
</header>
{{end}}

{{define "foot"}}
<footer class="foot">
  <p>Monitored by <a href="https://github.com/MrtnOmwenga/lighthouse">Lighthouse</a>, an open-source uptime monitor written in Go.</p>
</footer>
</body>
</html>
{{end}}
