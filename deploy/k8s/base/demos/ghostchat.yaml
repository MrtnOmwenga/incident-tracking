# GhostChat: end-to-end encrypted chat. MongoDB holds only ciphertext; Redis carries presence and
# pub/sub. The demo's data is disposable.
apiVersion: v1
kind: Service
metadata:
  name: ghostchat-mongo
spec:
  selector: { app: ghostchat-mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghostchat-mongo
spec:
  serviceName: ghostchat-mongo
  replicas: 1
  selector:
    matchLabels: { app: ghostchat-mongo }
  template:
    metadata:
      labels: { app: ghostchat-mongo }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # mongodb
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mongo
          image: docker.io/library/mongo:8.0
          args: [--bind_ip_all]
          ports: [{ containerPort: 27017 }]
          readinessProbe:
            exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"] }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: configdb, mountPath: /data/configdb }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: configdb, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ghostchat-redis
spec:
  selector: { app: ghostchat-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostchat-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: ghostchat-redis }
  template:
    metadata:
      labels: { app: ghostchat-redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # redis
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: [--save, "", --appendonly, "no"] # a cache and a message bus: nothing to persist
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: ghostchat
spec:
  selector: { app: ghostchat }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostchat
spec:
  replicas: 1
  selector:
    matchLabels: { app: ghostchat }
  template:
    metadata:
      labels: { app: ghostchat }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/mrtnomwenga/ghostchat
          envFrom:
            - configMapRef: { name: ghostchat-config }
          env:
            - { name: MONGODB_URI, value: "mongodb://ghostchat-mongo:27017/ghostchat" }
            - { name: REDIS_URL, value: "redis://ghostchat-redis:6379" }
            - { name: SECURE_COOKIES, value: "true" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ghostchat-app, key: jwt-secret } }
          ports: [{ containerPort: 5000 }]
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: {} }
