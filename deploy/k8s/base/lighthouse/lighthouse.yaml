apiVersion: v1
kind: Service
metadata:
  name: lighthouse
spec:
  selector: { app: lighthouse }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lighthouse
spec:
  replicas: 1
  selector:
    matchLabels: { app: lighthouse }
  template:
    metadata:
      labels: { app: lighthouse }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless "nonroot"
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Migrations run as the database owner before the server starts; they're idempotent.
      initContainers:
        - name: migrate
          image: ghcr.io/mrtnomwenga/lighthouse
          args: [migrate]
          env:
            - { name: MIGRATE_DATABASE_URL, value: "postgres://lighthouse_owner@postgres:5432/lighthouse?sslmode=disable" }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: lighthouse-db, key: owner-password } }
            - { name: DATABASE_URL, value: "postgres://lighthouse_api@postgres:5432/lighthouse?sslmode=disable" }
            - name: APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: lighthouse-db, key: app-password } }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: lighthouse
          image: ghcr.io/mrtnomwenga/lighthouse
          args: [serve]
          envFrom:
            - configMapRef: { name: lighthouse-config }
          env:
            - { name: DATABASE_URL, value: "postgres://lighthouse_api@postgres:5432/lighthouse?sslmode=disable" }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: lighthouse-db, key: app-password } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: lighthouse-app, key: github-client-secret } }
            - name: SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: lighthouse-app, key: smtp-username, optional: true } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: lighthouse-app, key: smtp-password, optional: true } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext: *restricted
