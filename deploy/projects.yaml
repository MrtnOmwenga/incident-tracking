projects:
  - slug: redacted
    name: Redacted
    tagline: Collaborative editing where words black out as your clearance drops.
    description: >-
      The live demo of RBAC-API: multi-tenant access control with PostgreSQL row-level security,
      document sharing, clearance-classified words and a hash-chained audit log.
    tags: [NestJS, PostgreSQL, Yjs, React]
    repo: https://github.com/MrtnOmwenga/RBAC-API
    demo: https://redacted.example.com
    health: http://redacted.demos.svc.cluster.local:3000/health
    monitor: redacted
    intro:
      - title: A briefing room for secret agents
        body: One mission briefing, open on three screens at once, for a Director, an Analyst and an Intern. Each sees only what their clearance allows.
      - title: Redaction happens on the server
        body: Text above your clearance never reaches your browser, not in the page and not in the network traffic. A black bar is all you get.
      - title: Permissions change live
        body: The Director can demote someone mid-sentence. Their editor locks and sections black out while they are still typing.
      - title: Classify single words
        body: Select words and mark them Secret, the way you would make them bold. Readers without clearance get a copy the server redacted for them.

  - slug: ghostchat
    name: GhostChat
    tagline: End-to-end encrypted chat the server can't read or quietly rewrite.
    description: >-
      Messages and files are encrypted in the browser, history is signed and hash-chained, and
      identity keys are published in a transparency log with Merkle proofs.
    tags: [React, Express, Socket.IO, MongoDB, libsodium]
    repo: https://github.com/MrtnOmwenga/GhostChat
    demo: https://ghostchat.example.com
    health: http://ghostchat.demos.svc.cluster.local:3000/health
    monitor: ghostchat
    intro:
      - title: Chat the server can't read
        body: Messages and files are encrypted in your browser with libsodium before they leave it. The server only ever stores and relays ciphertext.
      - title: History nobody can rewrite
        body: Every message is signed and chained to the one before it, so the server can't drop, reorder or edit messages without your browser noticing.
      - title: Keys you can check
        body: Identity keys are published in a transparency log. Merkle proofs let your browser confirm it sees the same keys as everyone else.
      - title: Try it with yourself
        body: No sign-up, since identities are anonymous keys. Open it in a second browser window, or a private one, to have someone to talk to.

  - slug: lighthouse
    name: Lighthouse
    tagline: This site. An uptime monitor, status page and demo launcher in Go.
    description: >-
      Checks every project, opens and resolves incidents on its own, and wakes demos on demand.
      PostgreSQL row-level security, SSRF protection, property tests and fuzzing.
    tags: [Go, PostgreSQL, Docker]
    repo: https://github.com/MrtnOmwenga/lighthouse
    monitor: lighthouse
    no_demo_note: You're looking at it. The status page is the live part.

  - slug: pair-bridge
    name: PairBridge
    tagline: Two-way file sharing between a Linux laptop and an Android tablet.
    description: FastAPI and FUSE on the laptop, a native Android DocumentsProvider on the tablet.
    tags: [Python, FastAPI, FUSE, Android]
    repo: https://github.com/MrtnOmwenga/pair-bridge
    no_demo_note: Runs on your own devices, so there's no hosted demo. The README shows how to set it up.
