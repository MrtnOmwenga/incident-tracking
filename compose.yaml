# Local stack: Postgres, a one-off migration, and Lighthouse on http://localhost:8080.
# Passwords come from .env (copy .env.example); the database is only reachable inside the stack.
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: lighthouse
      POSTGRES_USER: lighthouse_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighthouse_owner -d lighthouse"]
      interval: 2s
      retries: 30

  # Applies migrations as the owner and creates the API's login role (a member of
  # lighthouse_app, subject to row-level security).
  migrate:
    build: .
    command: ["migrate"]
    environment:
      MIGRATE_DATABASE_URL: postgres://lighthouse_owner@db:5432/lighthouse?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgres://lighthouse_api@db:5432/lighthouse?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }

  lighthouse:
    build: .
    ports: ["8080:8080"]
    environment:
      LIGHTHOUSE_ENV: ${LIGHTHOUSE_ENV:-development}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_URL: postgres://lighthouse_api@db:5432/lighthouse?sslmode=disable
      PGPASSWORD: ${APP_DB_PASSWORD}
      OWNER_NAME: ${OWNER_NAME:-Lighthouse}
      DEV_LOGIN: ${DEV_LOGIN:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OWNER_GITHUB_ID: ${OWNER_GITHUB_ID:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      SANDBOX_LIMIT_PER_HOUR: ${SANDBOX_LIMIT_PER_HOUR:-6}
      SITE_DIR: /site
    volumes:
      - ${SITE_DIR:-./deploy/site}:/site:ro,z
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  db:
