services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${API_URL}/api/v1
    depends_on:
      backend:
        condition: service_healthy
    command: > 
      sh -c "npm install && node seed.js && npm run dev -- --host"
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    volumes:
      - ./backend:/app
      - /app/go/pkg/mod
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL_MODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "go install github.com/google/wire/cmd/wire@latest && cd /app && wire ./pkg/containers && go run ./cmd/main.go"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 45s
      timeout: 30s
      retries: 15
      start_period: 60s
    networks:
      - default

  migration:
    image: migrate/migrate
    volumes:
      - type: bind
        source: ./backend/migrations
        target: /migrations
        selinux: z
    user: 1000:1000
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path", "/migrations", "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable", "up", "2"]
    profiles: ["migrate"]
    networks:
      - default

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - default

volumes:
  postgres_data: